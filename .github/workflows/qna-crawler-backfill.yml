name: QNA 크롤러 - 백필 (수동 트리거)

on:
  workflow_dispatch:
    inputs:
      start_id:
        description: '시작 ID (기본값: 7, ID 1~6은 테스트 게시물)'
        required: false
        default: '7'
      end_id:
        description: '종료 ID (기본값: 2088)'
        required: false
        default: '2088'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6시간

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: ./crawlers/qna
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: QNA 크롤러 실행 (백필)
        working-directory: ./crawlers/qna
        env:
          QNA_LOGIN_ID: ${{ secrets.QNA_LOGIN_ID }}
          QNA_LOGIN_PW: ${{ secrets.QNA_LOGIN_PW }}
          QNA_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.QNA_GCP_SERVICE_ACCOUNT_JSON }}
          QNA_SHEET_ID: ${{ secrets.BIGQUERY_MAPPING_SHEET_ID }}
          QNA_SHEET_GID: 1776222090
          QNA_BOARD_URL: ${{ secrets.QNA_BOARD_URL }}
          QNA_CRAWL_MODE: backfill
          QNA_START_ID: ${{ github.event.inputs.start_id }}
          QNA_END_ID: ${{ github.event.inputs.end_id }}
        run: |
          python qna_crawler.py

      - name: 완료 알림
        if: success()
        run: echo "✅ QNA 백필 크롤링 완료"

      - name: 실패 알림
        if: failure()
        run: |
          echo "❌ QNA 백필 크롤링 실패"
          exit 1
