name: SP-bot Sync (수동 실행 · 자동 스케줄 중단)

on:
  # 자동 스케줄 중단 (2026-09-10) — SP봇 미사용에 따라 데이터 수집·Gemini 호출을 멈춤.
  # 재개하려면 아래 두 줄의 주석을 풀면 된다.
  # schedule:
  #   - cron: "0 18 * * *"   # 매일 KST 03:00
  workflow_dispatch:  # 수동 실행은 계속 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            streamlit \
            gspread \
            google-auth \
            google-genai \
            google-api-python-client \
            notion-client \
            pypdf \
            toml

      - name: Run Notion sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.BIGQUERY_MAPPING_SHEET_ID }}
          PROMOTION_SHEET_ID: ${{ secrets.PROMOTION_SHEET_ID }}
          SPBOT_SKIP_HUB_PAGE_IDS: ${{ secrets.SPBOT_SKIP_HUB_PAGE_IDS }}
        run: python scripts/spbot_sync_notion.py

      - name: Sleep 60s (Sheets API quota reset)
        run: sleep 60

      - name: Run Drive PDF sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.BIGQUERY_MAPPING_SHEET_ID }}
          PROMOTION_SHEET_ID: ${{ secrets.PROMOTION_SHEET_ID }}
          DRIVE_PDF_FOLDER_ID: ${{ secrets.DRIVE_PDF_FOLDER_ID }}
        run: python scripts/spbot_sync_drive.py
