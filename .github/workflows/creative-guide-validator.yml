name: 제작 가이드 검증 (매일 05시 KST)

on:
  schedule:
    - cron: '0 20 * * 0'  # 매주 월요일 05:00 KST = 일요일 20:00 UTC
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: ./crawlers/creative_guide
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 제작 가이드 검증 실행
        working-directory: ./crawlers/creative_guide
        env:
          CG_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.QNA_GCP_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CG_DRIVE_FOLDER_ID: ${{ secrets.CG_DRIVE_FOLDER_ID }}
          CG_NOTIFY_EMAIL: ${{ secrets.CG_NOTIFY_EMAIL }}
        run: python creative_guide_validator.py

      - name: 완료
        if: success()
        run: echo "✅ 제작 가이드 검증 완료 ($(date '+%Y-%m-%d %H:%M:%S'))"

      - name: 실패
        if: failure()
        run: |
          echo "❌ 제작 가이드 검증 실패"
          exit 1
