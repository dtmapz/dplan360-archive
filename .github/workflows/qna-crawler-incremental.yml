name: QNA 크롤러 - 증분 (수동 실행 · 자동 스케줄 중단)

on:
  # 자동 스케줄 중단 (2026-09-10) — SP봇 미사용에 따라 QNA 수집을 멈춤.
  # 재개하려면 아래 두 줄의 주석을 풀면 된다.
  # schedule:
  #   - cron: '0 20 * * *'   # 매일 새벽 5시 KST
  workflow_dispatch:  # 수동 트리거는 계속 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: ./crawlers/qna
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: QNA 크롤러 실행 (증분)
        working-directory: ./crawlers/qna
        env:
          QNA_LOGIN_ID: ${{ secrets.QNA_LOGIN_ID }}
          QNA_LOGIN_PW: ${{ secrets.QNA_LOGIN_PW }}
          QNA_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.QNA_GCP_SERVICE_ACCOUNT_JSON }}
          QNA_SHEET_ID: ${{ secrets.BIGQUERY_MAPPING_SHEET_ID }}
          QNA_SHEET_GID: 1776222090
          QNA_BOARD_URL: ${{ secrets.QNA_BOARD_URL }}
          QNA_CRAWL_MODE: incremental
        run: |
          python qna_crawler.py

      - name: 완료 알림
        if: success()
        run: echo "✅ QNA 증분 크롤링 완료 ($(date '+%Y-%m-%d %H:%M:%S KST'))"

      - name: 실패 알림
        if: failure()
        run: |
          echo "❌ QNA 증분 크롤링 실패 ($(date '+%Y-%m-%d %H:%M:%S KST'))"
          exit 1
