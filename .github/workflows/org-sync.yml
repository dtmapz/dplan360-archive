name: 조직도 → 회원가입 화이트리스트 동기화 (매일 새벽 4시)

on:
  schedule:
    # 매일 새벽 4시 KST = 전날 19:00 UTC
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: ./crawlers/org_sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 조직도 동기화 실행
        working-directory: ./crawlers/org_sync
        env:
          ORG_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.QNA_GCP_SERVICE_ACCOUNT_JSON }}
          ORG_SHEET_ID: ${{ secrets.PROMOTION_SHEET_ID }}
          ORG_TAB_NAME: organization
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python sync_org_allowlist.py

      - name: 완료 알림
        if: success()
        run: echo "✅ 조직도 동기화 완료 ($(date '+%Y-%m-%d %H:%M:%S KST'))"

      - name: 실패 알림
        if: failure()
        run: |
          echo "❌ 조직도 동기화 실패 ($(date '+%Y-%m-%d %H:%M:%S KST'))"
          exit 1
